[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aalpy-extra"
version = "0.1.0"
description = "Extensions and experimental additions to the AALpy automata learning library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Martin Tappler", email = "martin.tappler@tuwien.ac.at" },
    { name = "Benjamin von Berg", email = "benjamin.vonberg@tugraz.at" },
]
dependencies = [
    "aalpy>=1.5.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
stormpy = ["stormpy>=1.13.0"]
test = ["pytest", "pytest-timeout"]
all = ["aalpy-extra[stormpy,test]"]

[project.urls]
Homepage = "https://github.com/zwergziege/AALpy-extra"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["aalpy_extra*"]

[tool.pytest.ini_options]
pythonpath = ["."]
